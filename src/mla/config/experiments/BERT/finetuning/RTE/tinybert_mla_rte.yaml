# @package _global_
defaults:
  - /fine_tuning_schema
  - _self_

experiment_name: TinyBERT_MLA_RTE_kv${kv_compression_dim}_q${q_compression_dim}
attention_mechanism: MLA
job_type: fine_tuning
experiment_project: TinyBERT
model_config_name: bert-base-uncased
kv_compression_dim: ???
q_compression_dim: ???
output_compression_dim: null

# Dataset
dataset_name: glue
dataset_config_name: rte
drop_last: True
sentence_keys: ["sentence1", "sentence2"]
task_type: fine_tuning
parallel_processes: 8
num_workers: 0
pin_memory: False

# Optimizer
max_steps: 770 # 77 * 10
warmup: True
warmup_rate: 0.05
max_norm: 1.0
learning_rate: 3e-5
weight_decay: 0.01

# Model
hidden_size: 312
max_seq_length: 128
num_labels: 2
mixed_precision: "no"

# Training
batch_size: 32
eval_batch_size: 277
gradient_accumulation_steps: 1
train_eval_steps: 10
eval_steps: 50
eval_metric: "accuracy"
fine_tuning_seeds: [42, 123, 456, 789, 999]
