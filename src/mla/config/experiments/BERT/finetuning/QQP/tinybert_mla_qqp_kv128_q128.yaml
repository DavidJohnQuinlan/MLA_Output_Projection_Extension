# @package _global_
defaults:
  - /fine_tuning_schema
  - _self_

experiment_name: TinyBERT_MLA_QQP_kv128_q128
base_model: BERT
attention_mechanism: MLA
job_type: fine_tuning
experiment_project: TinyBERT
model_config_name: bert-base-uncased
kv_compression_dim: 128
q_compression_dim: 128
output_compression_dim: null

# Dataset
dataset_name: glue
dataset_config_name: qqp
drop_last: True
sentence_keys: ["question1", "question2"]
task_type: fine_tuning
parallel_processes: 8
num_workers: 0
pin_memory: False

# Optimizer
max_steps: 34110 # 11370 * 3
warmup: True
warmup_rate: 0.05
max_norm: 1.0
learning_rate: 2e-5
weight_decay: 0.01

# Model
hidden_size: 312
max_seq_length: 128
num_labels: 2
mixed_precision: "no"

# Training
batch_size: 32
eval_batch_size: 256
gradient_accumulation_steps: 1
train_eval_steps: 10
eval_steps: 500
eval_metric: "f1"
fine_tuning_seeds: [42, 123, 456, 789, 999]
