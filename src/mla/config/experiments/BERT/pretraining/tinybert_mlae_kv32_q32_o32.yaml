# @package _global_
defaults:
  - /pre_training_schema
  - _self_

# General
experiment_name: TinyBERT_MLAE_kv32_q32_o32
base_model: BERT
attention_mechanism: MLAE
job_type: pre_training
experiment_project: TinyBERT
model_config_name: bert-base-uncased
kv_compression_dim: 32
q_compression_dim: 32
output_compression_dim: 32

# Dataset
dataset_name: Skylion007/openwebtext
dataset_config_name: null
max_load_pct: 15
train_token_budget: 1_000_000_000
val_token_budget: 1_000_000
drop_last: True
sentence_keys: ["text"]
task_type: pre_training
parallel_processes: 8
num_workers: 0
pin_memory: False

# Optimizer
max_steps: 25000
warmup: True
warmup_rate: 0.05
max_norm: 1.0
learning_rate: 5e-4
weight_decay: 0.01

# Model
n_layer: 4
n_head: 12
hidden_size: 312
intermediate_size: 1200
max_seq_length: 128
max_position_embeddings: 128
mixed_precision: "no"

# Training
batch_size: 8
eval_batch_size: 64
gradient_accumulation_steps: 32
mlm: True
mlm_probability: 0.15
train_eval_steps: 10
eval_steps: 500
eval_metric: loss
pre_training_seeds: [42]
