# @package _global_
defaults:
  - /fine_tuning_schema
  - _self_

experiment_name: TinyGPT2_MHAE_MNLI_o256
base_model: GPT2
attention_mechanism: MHAE
job_type: fine_tuning
experiment_project: TinyGPT2
model_config_name: gpt2
kv_compression_dim: null
q_compression_dim: null
output_compression_dim: 256

# Dataset
dataset_name: glue
dataset_config_name: mnli
drop_last: True
sentence_keys: ["premise", "hypothesis"]
task_type: fine_tuning
parallel_processes: 8
num_workers: 0
pin_memory: False

# Optimizer
max_steps: 36813 # 12271 * 3
warmup: True
warmup_rate: 0.05
max_norm: 1.0
learning_rate: 2e-5
weight_decay: 0.01

# Model
hidden_size: 312
max_seq_length: 512
num_labels: 3
mixed_precision: "no"

# Training
batch_size: 32
eval_batch_size: 256
gradient_accumulation_steps: 1
train_eval_steps: 10
eval_steps: 500
eval_metric: "accuracy"
fine_tuning_seeds: [42, 123, 456, 789, 999]
