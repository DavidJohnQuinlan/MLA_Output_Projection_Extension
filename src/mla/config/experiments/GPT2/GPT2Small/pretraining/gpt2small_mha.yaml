# @package _global_
defaults:
  - /pretraining_schema
  - _self_

# General
experiment_name: GPT2Small_MHA
base_model: GPT2
attention_mechanism: MHA
job_type: pretraining
experiment_project: GPT2Small
model_config_name: gpt2
kv_compression_dim: null
q_compression_dim: null
output_compression_dim: null

# Dataset
dataset_name: Skylion007/openwebtext
dataset_config_name: null
max_load_pct: 30
train_token_budget: 2_500_000_000
val_token_budget: 5_000_000
drop_last: True
sentence_keys: ["text"]
task_type: pretraining
parallel_processes: 8
num_workers: 0
pin_memory: False

# Optimizer
max_steps: 19000
warmup: True
warmup_rate: 0.05
max_norm: 1.0
learning_rate: 5e-4
weight_decay: 0.1

# Model
n_layer: 12
n_head: 12
hidden_size: 768
max_seq_length: 1024
max_position_embeddings: 1024
mixed_precision: "fp16"
loss_type: ForCausalLM

# Training
batch_size: 8
eval_batch_size: 16
gradient_accumulation_steps: 16
train_eval_steps: 10
eval_steps: 500
eval_metric: loss
keep_last_n_checkpoints: 3
pretraining_seeds: [42]
