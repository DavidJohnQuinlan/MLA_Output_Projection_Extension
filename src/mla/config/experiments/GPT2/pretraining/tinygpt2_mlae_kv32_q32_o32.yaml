# @package _global_
defaults:
  - /pre_training_schema
  - _self_

# General
experiment_name: TinyGPT2_MLAE_kv32_q32_o32
base_model: GPT2
attention_mechanism: MLAE
job_type: pre_training
experiment_project: TinyGPT2
model_config_name: gpt2
kv_compression_dim: 32
q_compression_dim: 32
output_compression_dim: 32

# Dataset
dataset_name: Skylion007/openwebtext
dataset_config_name: null
max_load_pct: 22
train_token_budget: 1_400_000_000
val_token_budget: 1_000_000
drop_last: True
sentence_keys: ["text"]
task_type: pre_training
parallel_processes: 8
num_workers: 0
pin_memory: False

# Optimizer
max_steps: 20000
warmup: True
warmup_rate: 0.05
max_norm: 1.0
learning_rate: 5e-4
weight_decay: 0.1

# Model
n_layer: 6
n_head: 4
hidden_size: 312
max_seq_length: 512
max_position_embeddings: 512
mixed_precision: "fp16"
loss_type: ForCausalLM

# Training
batch_size: 8
eval_batch_size: 16
gradient_accumulation_steps: 16
train_eval_steps: 10
eval_steps: 500
eval_metric: loss
pre_training_seeds: [42]
