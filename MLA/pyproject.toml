[project]
name = "mla"
version = "0.1.0"
description = "Package containing MLA extention code for research experiments."
readme = "README.md"
requires-python = ">=3.13.14"
dependencies = [
    "accelerate==1.12.0",
    "calflops==0.3.2",
    "datasets==4.8.5",
    "hydra-core==1.3.3",
    "matplotlib==3.10.9",
    "scikit-learn==1.8.0",
    "seaborn==0.13.2",
    "tabulate>=0.10.0",
    "torch==2.11.0",
    "transformers==4.57.5",
    "wandb==0.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mla"]

[tool.ruff]
target-version = "py314"
line-length = 1000

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E701"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[project.scripts]
pretrain = "mla.model_training.model_pretraining:model_pretraining"
finetune = "mla.model_training.model_finetuning:run_multiple_fine_tunings"
