# @package _global_
defaults:
  - /fine_tuning_schema
  - _self_

experiment_name: TinyBERT_MLA_CoLA_kv32_q32
base_model: BERT
attention_mechanism: MLA
job_type: fine_tuning
experiment_project: TinyBERT
model_config_name: bert-base-uncased
kv_compression_dim: 32
q_compression_dim: 32
output_compression_dim: null

# Dataset
dataset_name: glue
dataset_config_name: cola
drop_last: True
sentence_keys: ["sentence"]
task_type: fine_tuning
parallel_processes: 8
num_workers: 0
pin_memory: False

# Optimizer
max_steps: 2670 # 267 * 10
warmup: True
warmup_rate: 0.05
max_norm: 1.0
learning_rate: 3e-5
weight_decay: 0.01

# Model
pretrained_model_name: pre_training_wikitext-103-raw-v1__TinyBERT_MLA_kv32_q32
fine_tuned_model_name: fine_tuning_cola__TinyBERT_MLA__kv32_q32
n_layer: 4
n_head: 12
hidden_size: 312
intermediate_size: 1200
max_seq_length: 128
max_position_embeddings: 128
dropout_rate: 0.1
num_labels: 2
mixed_precision: "no"

# Training
batch_size: 32
eval_batch_size: 512
gradient_accumulation_steps: 1
train_eval_steps: 10
eval_steps: 500
eval_metric: "mcc"
seeds: [42, 123, 456, 789, 999]
