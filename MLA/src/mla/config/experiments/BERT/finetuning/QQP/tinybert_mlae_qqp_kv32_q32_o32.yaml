# @package _global_
defaults:
  - /fine_tuning_schema
  - _self_

experiment_name: TinyBERT_MLAE_QQP_kv32_q32_o32
base_model: BERT
attention_mechanism: MLAE
job_type: fine_tuning
experiment_project: TinyBERT
model_config_name: huawei-noah/TinyBERT_General_4L_312D
kv_compression_dim: 32
q_compression_dim: 32
output_compression_dim: 32

# Dataset
dataset_name: glue
dataset_config_name: qqp
drop_last: True
sentence_keys: ["question1", "question2"]
task_type: fine_tuning
parallel_processes: 8
num_workers: 0
pin_memory: False

# Optimizer
max_steps: 34110 # 11370 * 3
warmup: True
warmup_rate: 0.05
max_norm: 1.0
learning_rate: 2e-5
weight_decay: 0.01

# Model
pretrained_model_name: pre_training_wikitext-103-raw-v1__TinyBERT_MLAE_kv32_q32_o32
fine_tuned_model_name: fine_tuning_qqp__TinyBERT_MLAE__kv32_q32_o32
dropout_rate: 0.1
hidden_size: 312
num_labels: 2
max_seq_length: 128
max_position_embeddings: 128
mixed_precision: "no"

# Training
batch_size: 32
eval_batch_size: 1024
gradient_accumulation_steps: 1
train_eval_steps: 10
eval_steps: 500
eval_metric: "f1"
seeds: [42, 123, 456, 789, 999]
