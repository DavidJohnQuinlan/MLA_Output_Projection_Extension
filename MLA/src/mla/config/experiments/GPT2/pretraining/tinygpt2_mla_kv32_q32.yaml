# @package _global_
defaults:
  - /pre_training_schema
  - _self_

# General
experiment_name: TinyGPT2_MLA_kv32_q32
base_model: GPT2
attention_mechanism: MLA
job_type: pre_training
experiment_project: TinyGPT2
model_config_name: gpt2
kv_compression_dim: 32
q_compression_dim: 32
output_compression_dim: null

# Dataset
dataset_name: wikitext
dataset_config_name: wikitext-103-raw-v1
drop_last: True
sentence_keys: ["text"]
task_type: pre_training
parallel_processes: 8
num_workers: 0
pin_memory: False

# Optimizer
max_steps: 10 # 25000
warmup: True
warmup_rate: 0.05
max_norm: 1.0
learning_rate: 5e-4
weight_decay: 0.1

# Model
pretrained_model_name: pre_training_wikitext-103-raw-v1__TinyGPT2_MLA_kv32_q32
n_layer: 6
n_head: 4
hidden_size: 256
max_seq_length: 128
max_position_embeddings: 128
mixed_precision: "no"
loss_type: ForCausalLM

# Training
batch_size: 8
eval_batch_size: 64
gradient_accumulation_steps: 32
train_eval_steps: 10
eval_steps: 5 # 500
eval_metric: loss
