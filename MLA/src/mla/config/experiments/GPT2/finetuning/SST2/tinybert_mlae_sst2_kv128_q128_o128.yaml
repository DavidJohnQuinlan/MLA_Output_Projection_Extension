# @package _global_
defaults:
  - /fine_tuning_schema
  - _self_

experiment_name: TinyBERT_MLAE_SST2_kv128_q128_o128
base_model: GPT2
attention_mechanism: MLAE
job_type: fine_tuning
experiment_project: TinyBERT
model_config_name: huawei-noah/TinyBERT_General_4L_312D
kv_compression_dim: 128
q_compression_dim: 128
output_compression_dim: 128

# Dataset
dataset_name: glue
dataset_config_name: sst2
drop_last: True
sentence_keys: ["sentence"]
task_type: fine_tuning
parallel_processes: 8
num_workers: 0
pin_memory: False

# Optimizer
max_steps: 10520 # 2104 * 5
warmup: True
warmup_rate: 0.05
max_norm: 1.0
learning_rate: 2e-5
weight_decay: 0.01

# Model
pretrained_model_name: pre_training_wikitext-103-raw-v1__TinyBERT_MLAE_kv128_q128_o128
fine_tuned_model_name: fine_tuning_sst2__TinyBERT_MLAE__kv128_q128_o128
dropout_rate: 0.1
hidden_size: 312
num_labels: 2
max_seq_length: 128
max_position_embeddings: 128
mixed_precision: "no"

# Training
batch_size: 32
eval_batch_size: 872
gradient_accumulation_steps: 1
train_eval_steps: 10
eval_steps: 500
eval_metric: "accuracy"
seeds: [42, 123, 456, 789, 999]
