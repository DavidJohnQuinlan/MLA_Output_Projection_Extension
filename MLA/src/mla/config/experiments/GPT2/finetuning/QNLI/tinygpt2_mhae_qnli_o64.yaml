# @package _global_
defaults:
  - /fine_tuning_schema
  - _self_

experiment_name: TinyGPT2_MHAE_QNLI_o64
base_model: GPT2
attention_mechanism: MHAE
job_type: fine_tuning
experiment_project: TinyGPT2
model_config_name: gpt2
kv_compression_dim: null
q_compression_dim: null
output_compression_dim: 64

# Dataset
dataset_name: glue
dataset_config_name: qnli
drop_last: True
sentence_keys: ["question", "sentence"]
task_type: fine_tuning
parallel_processes: 8
num_workers: 0
pin_memory: False

# Optimizer
max_steps: 9819 # 3273 * 3
warmup: True
warmup_rate: 0.05
max_norm: 1.0
learning_rate: 2e-5
weight_decay: 0.01

# Model
pretrained_model_name: pre_training_wikitext-103-raw-v1__TinyGPT2_MHAE_o64
fine_tuned_model_name: fine_tuning_qnli__TinyGPT2_MHAE__o64
dropout_rate: 0.1
hidden_size: 312
num_labels: 2
max_seq_length: 128
max_position_embeddings: 128
mixed_precision: "no"

# Training
batch_size: 32
eval_batch_size: 1024
gradient_accumulation_steps: 1
train_eval_steps: 10
eval_steps: 500
eval_metric: "accuracy"
seeds: [42, 123, 456, 789, 999]
