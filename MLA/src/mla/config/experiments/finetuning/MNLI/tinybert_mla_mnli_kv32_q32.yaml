# @package _global_
experiment_name: TinyBERT_MLA_MNLI_kv32_q32
attention_mechanism: MLA
job_type: fine_tuning
experiment_project: TinyBERT
model_config_name: huawei-noah/TinyBERT_General_4L_312D
kv_compression_dim: 32
q_compression_dim: 32
output_compression_dim: null

# Dataset
dataset_name: glue
dataset_config_name: mnli
drop_last: True
sentence_keys: ["premise", "hypothesis"]
task_type: fine_tuning
parallel_processes: 8
num_workers: 0
pin_memory: False

# Optimizer
max_steps: 36813 # 12271 * 3
warmup: True
warmup_rate: 0.05
max_norm: 1.0
learning_rate: 2e-5
weight_decay: 0.01

# Model
pretrained_model_name: pre_training_wikitext-103-raw-v1__TinyBERT_MLA_kv32_q32
fine_tuned_model_name: fine_tuning_mnli__TinyBERT_MLA__kv32_q32
dropout_rate: 0.1
hidden_size: 312
num_labels: 3
max_seq_length: 128
max_position_embeddings: 128
mixed_precision: "no"

# Training
batch_size: 32
eval_batch_size: 1024
gradient_accumulation_steps: 1
train_eval_steps: 10
eval_steps: 500
eval_metric: "accuracy"
seeds: [42, 123, 456, 789, 999]
